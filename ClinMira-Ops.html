<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClinMira AI Ops</title>
    <style>
      :root {
        color-scheme: dark;
        --shell-bg: #090d14;
        --shell-surface: rgba(255, 255, 255, 0.05);
        --shell-border: rgba(255, 255, 255, 0.16);
        --shell-text: #e8edf7;
        --shell-muted: #aeb7c8;
        --shell-active: #4ea4ff;
        --shell-active-bg: rgba(78, 164, 255, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--shell-bg);
        color: var(--shell-text);
        font-family: "Inter", "Segoe UI", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      }

      .shell {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding-top: 12px;
      }

      .tabs {
        position: relative;
        z-index: 10;
        display: flex;
        align-items: center;
        width: min(1320px, 94vw);
        margin: 0 auto;
        gap: 8px;
        padding: 8px 10px;
        overflow: visible;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.065), rgba(255, 255, 255, 0.024));
        backdrop-filter: blur(14px) saturate(1.12);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.055);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        margin-right: 2px;
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.045);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.045);
      }

      .brand-logo {
        display: block;
        width: 18px;
        height: 18px;
        object-fit: contain;
      }

      .nav-items {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }

      .nav-item {
        position: relative;
        display: inline-flex;
      }

      .tab-btn {
        appearance: none;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--shell-muted);
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: color 160ms ease, border-color 160ms ease, background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
        white-space: nowrap;
      }

      .tab-btn::after {
        content: "";
        width: 5px;
        height: 5px;
        margin-top: -2px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        opacity: 0.72;
        transform: rotate(45deg);
        transition: transform 160ms ease, opacity 160ms ease;
      }

      .nav-item.is-open .tab-btn,
      .tab-btn:hover {
        color: var(--shell-text);
        border-color: rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.035);
        transform: translateY(-1px);
      }

      .nav-item.is-open .tab-btn::after,
      .tab-btn[aria-expanded="true"]::after {
        opacity: 1;
        transform: translateY(1px) rotate(-135deg);
      }

      .tab-btn[aria-selected="true"] {
        color: #eef8ff;
        border-color: rgba(78, 164, 255, 0.36);
        background: linear-gradient(135deg, rgba(78, 164, 255, 0.18), rgba(138, 125, 255, 0.14));
        box-shadow: inset 0 0 0 1px rgba(78, 164, 255, 0.12), 0 8px 18px rgba(0, 0, 0, 0.14);
      }

      .nav-dropdown {
        position: absolute;
        z-index: 30;
        top: calc(100% + 10px);
        left: 50%;
        width: 236px;
        padding: 6px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 14px;
        background: linear-gradient(135deg, #151b25, #0f151e);
        backdrop-filter: none;
        box-shadow: 0 22px 48px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.055);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translate(-50%, -4px) scale(0.98);
        transform-origin: top center;
        transition: opacity 150ms ease, visibility 150ms ease, transform 150ms ease;
      }

      .nav-dropdown::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: -12px;
        height: 12px;
      }

      .nav-item.is-open .nav-dropdown {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translate(-50%, 0) scale(1);
      }

      .dropdown-option {
        appearance: none;
        width: 100%;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 9px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
        color: var(--shell-text);
        text-align: left;
        cursor: pointer;
        transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
      }

      .dropdown-option + .dropdown-option {
        margin-top: 2px;
      }

      .dropdown-option:hover,
      .dropdown-option:focus-visible,
      .dropdown-option[aria-current="page"] {
        background: rgba(255, 255, 255, 0.055);
        border-color: rgba(255, 255, 255, 0.09);
      }

      .dropdown-option:active {
        transform: scale(0.99);
      }

      .dropdown-icon {
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        color: #dceeff;
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
      }

      .dropdown-copy {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .dropdown-title {
        color: #f2f7ff;
        font-size: 12.5px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }

      .dropdown-description {
        color: var(--shell-muted);
        font-size: 11.5px;
        line-height: 1.35;
      }

      .panels {
        position: relative;
        z-index: 1;
        flex: 1;
        min-height: 0;
        margin-top: 10px;
      }

      .panel {
        display: none;
        width: 100%;
        height: 100%;
      }

      .panel.active {
        display: block;
      }

      .panel-frame {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: var(--shell-bg);
      }

      .status {
        margin-left: auto;
        padding: 6px 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.035);
        font-size: 11.5px;
        color: var(--shell-muted);
        opacity: 0.9;
        white-space: nowrap;
      }

      @media (max-width: 720px) {
        .shell {
          padding-top: 8px;
        }

        .tabs {
          width: 94vw;
          flex-wrap: wrap;
          align-items: flex-start;
          gap: 8px;
          padding: 8px;
          border-radius: 16px;
        }

        .brand {
          width: 32px;
          height: 32px;
        }

        .nav-items {
          order: 2;
          width: 100%;
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 6px;
        }

        .nav-item {
          display: block;
          min-width: 0;
        }

        .tab-btn {
          width: 100%;
          justify-content: space-between;
          padding: 8px 10px;
          font-size: 12px;
        }

        .nav-dropdown {
          left: 0;
          width: min(280px, calc(94vw - 16px));
          transform: translateY(-4px) scale(0.98);
        }

        .nav-item.is-open .nav-dropdown {
          transform: translateY(0) scale(1);
        }

        .panels {
          margin-top: 8px;
        }

        .status {
          display: none;
        }
      }

      @media (max-width: 420px) {
        .nav-items {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

                <span class="dropdown-copy">
                  <span class="dropdown-title">Addresses</span>

                </span>
              </button>
            </div>
          </div>
          <div class="nav-item">
            <button
              type="button"
              id="tab-docs"
              class="tab-btn nav-trigger"
              role="tab"
              aria-selected="false"
              aria-controls="panel-section"
              aria-haspopup="menu"
              aria-expanded="false"
              data-tab="docs"
            >
              Docs
            </button>
            <div class="nav-dropdown" role="menu" aria-label="Docs options">
              <button class="dropdown-option" type="button" role="menuitem" data-nav-tab="docs" data-nav-subtab="commands">
                <span class="dropdown-icon">⌘</span>
                <span class="dropdown-copy">
                  <span class="dropdown-title">Commands</span>
                  <span class="dropdown-description">Docs Docker commands.</span>
                </span>
              </button>
              <button class="dropdown-option" type="button" role="menuitem" data-nav-tab="docs" data-nav-subtab="addresses">
                <span class="dropdown-icon">↗</span>
                <span class="dropdown-copy">
                  <span class="dropdown-title">Addresses</span>
                  <span class="dropdown-description">Docs site and endpoints.</span>
                </span>
              </button>
            </div>
          </div>
          <div class="nav-item">
            <button
              type="button"
              id="tab-system-maintenance"
              class="tab-btn nav-trigger"
              role="tab"
              aria-selected="false"
              aria-controls="panel-section"
              aria-haspopup="menu"
              aria-expanded="false"
              data-tab="system-maintenance"

              System Maintenance
            </button>
            <div class="nav-dropdown" role="menu" aria-label="System Maintenance options">
              <button class="dropdown-option" type="button" role="menuitem" data-nav-tab="system-maintenance" data-nav-subtab="commands">
                <span class="dropdown-icon">⌘</span>
                <span class="dropdown-copy">
                  <span class="dropdown-title">Commands</span>

                </span>
              </button>
              <button class="dropdown-option" type="button" role="menuitem" data-nav-tab="system-maintenance" data-nav-subtab="addresses">
                <span class="dropdown-icon">↗</span>
                <span class="dropdown-copy">
                  <span class="dropdown-title">Addresses</span>
                  <span class="dropdown-description">Main local surfaces.</span>
                </span>
              </button>
            </div>
          </div>
        </div>
        <div id="dashboard-status" class="status">Landing Page · Commands</div>
      </nav>

          <iframe id="frame-section" class="panel-frame" title="ClinMira AI Section Dashboard"></iframe>
        </section>
      </main>

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");

      function escapeAttribute(value) {
        return escapeHtml(value);

      function slugifyToken(value) {
        return String(value)
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      function decodeBase64Utf8(payload) {
        const cleaned = payload.replace(/\s+/g, "");
        const binary = atob(cleaned);
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      function injectBaseHref(html) {
        const baseHref = window.location.href.replace(/[#?].*$/, "").replace(/[^/]*$/, "");
        if (/<base\s/i.test(html)) {
          return html;
        }
        return html.replace(/<head(\s[^>]*)?>/i, (match) => `${match}<base href="${baseHref}">`);
      }

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");

        const style = doc.createElement("style");
        style.setAttribute("id", "commands-theme-sync");
        style.textContent = `
          :root {
            --bg-0: #090d14;
            --bg-1: #101620;
            --bg-2: #131b28;
            --text: #e8edf7;
            --muted: #aeb7c8;
            --accent: #58c8ff;
            --accent-2: #8f87ff;
            --ok: #51d4a4;
            --warn: #f2c56f;
            --danger: #f07baa;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-strong: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.12);
            --shadow: none;
          }

          html,
          body {
            background: var(--bg-0) !important;
          }

          body {
            font-family: "Inter", "Segoe UI", "SF Pro Text", "Helvetica Neue", sans-serif !important;
            min-height: 100vh;
          }

          body::before {
            display: none !important;
          }

          .container {
            width: min(1320px, 94vw) !important;
            max-width: none !important;
            margin: 0 auto !important;
            padding: 18px 0 28px !important;
          }

          .hero {
            border-radius: 16px !important;
            border: 1px solid var(--border) !important;
            background: rgba(17, 23, 33, 0.84) !important;
            backdrop-filter: blur(8px);
            padding: 16px 18px !important;
            margin: 0 !important;
          }

          .hero-brand {
            display: flex;
            align-items: center;
            gap: 10px;
          }

          .hero-logo {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            object-fit: contain;
            flex: 0 0 auto;
          }

          .hero h1,
          .hero-copy h1 {
            margin: 0;
            font-size: 0.98rem !important;
            letter-spacing: 0.01em;
            font-weight: 600;
          }

          .hero p,
          .hero-copy p {
            margin: 2px 0 0 !important;
            font-size: 0.8rem !important;
            color: var(--muted) !important;
          }

          .chips {
            display: none !important;
          }

          .section {
            margin-top: 12px !important;
            border-radius: 16px !important;
            border: 1px solid var(--border) !important;
            background: rgba(17, 23, 33, 0.84) !important;
            backdrop-filter: blur(8px);
          }

          .section-head {
            padding: 12px 14px !important;
            border-bottom: 1px solid var(--border) !important;
            background: transparent !important;
          }

          .section-head h2 {
            font-size: 0.82rem !important;
            font-weight: 600 !important;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-soft, #aeb7c8);
          }

          .section-head p {
            color: var(--muted) !important;
            font-size: 0.8rem !important;
          }

          .command-grid {
            padding: 12px !important;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)) !important;
            grid-auto-flow: dense !important;
            gap: 12px !important;
            align-items: stretch !important;
          }

          .command-card {
            min-height: 220px !important;
            height: 100% !important;
            padding: 14px !important;
            gap: 12px !important;
            border: 1px solid var(--border) !important;
            border-radius: 14px !important;
            background: rgba(255, 255, 255, 0.02) !important;
            box-shadow: none !important;
          }

          .command-card:hover {
            transform: translateY(-1px) !important;
            border-color: rgba(88, 200, 255, 0.35) !important;
            box-shadow: none !important;
          }

          .command-title h3 {
            font-size: 0.98rem !important;
            font-weight: 600 !important;
          }

          .command-title small {
            font-size: 0.76rem !important;
            color: var(--muted) !important;
          }

          .command-block {
            border-color: rgba(255, 255, 255, 0.16) !important;
            background: rgba(0, 0, 0, 0.28) !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
            scrollbar-width: thin;
            scrollbar-color: rgba(174, 183, 200, 0.34) transparent;
          }

          .command-block::-webkit-scrollbar {
            height: 6px;
          }

          .command-block::-webkit-scrollbar-track {
            background: transparent;
          }

          .command-block::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: rgba(174, 183, 200, 0.28);
            background-clip: padding-box;
            border: 2px solid transparent;
          }

          .command-block:hover::-webkit-scrollbar-thumb {
            background: rgba(88, 200, 255, 0.34);
            background-clip: padding-box;
          }

          .command-block code {
            color: #d8ecff !important;
            font-size: 0.85rem !important;
          }

          .command-meta {
            color: var(--muted) !important;
            font-size: 0.84rem !important;
            line-height: 1.5 !important;
          }

          .copy-btn {
            border-radius: 8px !important;
            border-color: rgba(88, 200, 255, 0.42) !important;
            background: rgba(88, 200, 255, 0.14) !important;
            color: #deefff !important;
            font-size: 0.86rem !important;
          }

          .copy-btn.copied {
            background: rgba(81, 212, 164, 0.2) !important;
            border-color: rgba(81, 212, 164, 0.45) !important;
          }

          .copy-btn.failed {
            background: rgba(240, 123, 170, 0.2) !important;
            border-color: rgba(240, 123, 170, 0.45) !important;
          }

          .copy-btn {
            margin-top: auto !important;
          }

          .footer-note {
            margin-top: 12px !important;
            font-size: 0.76rem !important;
            color: var(--muted) !important;
          }

          @media (max-width: 720px) {
            .container {
              width: 94vw !important;
              padding-top: 12px !important;
            }

            .command-grid {
              grid-template-columns: 1fr !important;
              padding: 10px !important;
            }

            .command-card {
              min-height: 220px !important;
            }
          }
        `;

        doc.head.appendChild(style);
        return "<!doctype html>\n" + doc.documentElement.outerHTML;
      }

      function updateHash() {
        const hash = `#${activeTab}/${activeSubtab}`;
        history.replaceState(null, "", `${window.location.pathname}${hash}`);
      }

      function mountView(tabName, subtabName) {
        if (tabName === "architecture" && !architectureLoaded) {
          const html = injectBaseHref(decodeBase64Utf8(architectureHtmlB64));
          const blobUrl = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
          frames.architecture.src = blobUrl;
          architectureLoaded = true;
        }

        if (tabName === "architecture") {
          return;
        }

        const key = `${tabName}:${subtabName}`;
        if (!mountedSectionViews.has(key)) {
          const html = subtabName === "addresses" ? buildAddressesHtml(tabName) : buildCommandsHtml(tabName);
          const blobUrl = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
          mountedSectionViews.set(key, blobUrl);
        }

        frames.section.src = mountedSectionViews.get(key);
      }

      function setActiveView(tabName, subtabName = activeSubtab) {
        activeTab = tabName;
        activeSubtab = normalizeSubtab(tabName, subtabName);

        tabs.forEach((btn) => {
          const selected = btn.dataset.tab === tabName;
          btn.setAttribute("aria-selected", selected ? "true" : "false");
        });

        navOptions.forEach((btn) => {
          const selected = btn.dataset.navTab === tabName && btn.dataset.navSubtab === activeSubtab;
          if (selected) {
            btn.setAttribute("aria-current", "page");
          } else {
            btn.removeAttribute("aria-current");
          }
        });

        const isArchitecture = tabName === "architecture";
        panels.architecture.classList.toggle("active", isArchitecture);
        panels.section.classList.toggle("active", !isArchitecture);

        if (status) {
          status.textContent = isArchitecture
            ? "Architecture Overview"
            : `${sectionConfigs[tabName].label} · ${activeSubtab === "addresses" ? "Addresses" : "Commands"}`;
        }

        mountView(tabName, activeSubtab);
        updateHash();
      }

      tabs.forEach((btn) => {
        btn.addEventListener("click", () => {
          const tabName = btn.dataset.tab;
          if (!tabName) return;
          setActiveView(tabName, activeSubtab || "commands");
        });
      });

      navOptions.forEach((btn) => {
        btn.addEventListener("click", () => {
          const tabName = btn.dataset.navTab;
          const subtabName = btn.dataset.navSubtab;
          if (!tabName || !subtabName) return;
          setActiveView(tabName, subtabName);
          closeNavDropdowns();
          btn.blur();
        });
      });

      function getInitialView() {
        const rawHash = window.location.hash.slice(1);
        if (!rawHash || rawHash === "architecture") {
          return { tabName: "landing", subtabName: "commands" };
        }

        const [tabName, subtabName] = rawHash.split("/");
        if (tabName in sectionConfigs) {
          return {
            tabName,
            subtabName: normalizeSubtab(tabName, subtabName),
          };
        }

        return { tabName: "landing", subtabName: "commands" };
      }

      const initialView = getInitialView();
      setActiveView(initialView.tabName, initialView.subtabName);
    </script>
  </body>
</html>
